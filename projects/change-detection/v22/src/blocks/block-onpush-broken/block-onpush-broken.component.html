<div class="block-container" [blockLineTarget]="block">
  <div class="block-wrap">
    <div #block class="block block__blue" [style.width.px]="400 / depth()" (click)="triggerInterval()">
      <i class="id">{{ id }}</i>
      <p>OnPush 🛑</p>
      <strong class="counter">{{count}}</strong>
    </div>
  </div>

  @if (tree()?.children; as children) {
    <div class="block-inner">
      @for (innerBlock of children; track $index) {
        <ng-container [blockOutlet]="innerBlock" [blockOutletDepth]="depth() + 1" />
      }
    </div>
  }
</div>

{{ highlightBlock() }}
